name: Publish Quest Item Clicker (manual)

on:
  # One-time push trigger for the user-requested v0.2 publication.
  push:
    branches: [main]
    paths:
      - '.release-triggers/quest-item-clicker-v0.2.0.0'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Quest Item Clicker test build run ID'
        required: true
        default: '45108066933'
      confirm:
        description: 'Publish this experimental build for installation (must be checked)'
        type: boolean
        required: true
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: qic-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.confirm) || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event_name == 'push' && '45108066933' || inputs.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Verify selected build and distribution visibility
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid run ID"; exit 1; }
          [[ "$(gh api "repos/$GH_REPO" --jq .visibility)" == public ]] || { echo "The repository must be public for Dalamud to access the feed. No files published."; exit 1; }
          run_json="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID")"
          jq -e --arg repo "$GH_REPO" '.conclusion == "success" and .status == "completed" and .head_branch == "main" and .head_repository.full_name == $repo and (.path | startswith(".github/workflows/quest-item-clicker.yml"))' <<< "$run_json" >/dev/null
          sha="$(jq -r .head_sha <<< "$run_json")"
          git merge-base --is-ancestor "$sha" HEAD || { echo "Build commit is not on main"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          pattern: QuestItemClicker-test-*
          merge-multiple: true
          path: staged
          github-token: ${{ github.token }}
          run-id: ${{ env.RUN_ID }}
      - name: Validate manifest and generate feed
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          test -f staged/latest.zip
          test -f staged/QuestItemClicker.json
          python3 - <<'PY'
          import json, os, re, time, zipfile
          from pathlib import Path

          staged = Path("staged")
          with zipfile.ZipFile(staged / "latest.zip") as archive:
              assert archive.testzip() is None
              assert "QuestItemClicker.dll" in archive.namelist()
              manifest = json.loads(archive.read("QuestItemClicker.json").decode("utf-8-sig"))
          assert manifest == json.loads((staged / "QuestItemClicker.json").read_text(encoding="utf-8-sig"))
          version = manifest["AssemblyVersion"]
          assert re.fullmatch(r"\d+\.\d+\.\d+\.\d+", version)
          assert manifest["InternalName"] == "QuestItemClicker"
          assert isinstance(manifest["DalamudApiLevel"], int)
          tag = f"QuestItemClicker-v{version}"
          if os.environ["GITHUB_EVENT_NAME"] == "push":
              # The GitHub Actions token may not create releases on app-authored pushes.
              url = f"https://raw.githubusercontent.com/{os.environ['GH_REPO']}/main/dist/{tag}/latest.zip"
          else:
              url = f"https://github.com/{os.environ['GH_REPO']}/releases/download/{tag}/latest.zip"
          feed_path = Path("pluginmaster.json")
          entries = json.loads(feed_path.read_text(encoding="utf-8-sig"))
          assert isinstance(entries, list)
          for previous in entries:
              if previous.get("InternalName") == "QuestItemClicker":
                  old = tuple(map(int, previous["AssemblyVersion"].split(".")))
                  assert tuple(map(int, version.split("."))) >= old, "Cannot downgrade published version"
          entry = dict(manifest)
          entry.update({
              "Name": "Quest Item Clicker",
              "Punchline": "Experimental quest item helper; starts in dry-run mode.",
              "RepoUrl": "https://github.com/" + os.environ["GH_REPO"],
              "ApplicableVersion": manifest.get("ApplicableVersion") or "any",
              "IsHide": False,
              "IsTestingExclusive": False,
              "DownloadLinkInstall": url,
              "DownloadLinkUpdate": url,
              "DownloadLinkTesting": url,
              "LastUpdate": str(int(time.time()))
          })
          entries = [item for item in entries if item.get("InternalName") != "QuestItemClicker"]
          entries.append(entry)
          feed_path.write_text(json.dumps(entries, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\nversion={version}\n")
          PY
      - name: Stage public versioned ZIP (one-time push release)
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.prepare.outputs.version }}"
          path="dist/QuestItemClicker-v${version}/latest.zip"
          mkdir -p "$(dirname "$path")"
          if test -f "$path"; then
            cmp staged/latest.zip "$path" || { echo "Existing versioned package differs"; exit 1; }
          else
            cp staged/latest.zip "$path"
          fi
      - name: Publish versioned release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
          BUILD_SHA: ${{ steps.verify.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Never replace a versioned binary; a rerun is only safe if bytes match.
            mkdir existing
            gh release download "$TAG" --pattern latest.zip --dir existing
            cmp staged/latest.zip existing/latest.zip || { echo "Version already exists with different bytes; bump the plugin version."; exit 1; }
          else
            gh release create "$TAG" staged/latest.zip --target "$BUILD_SHA" --title "Quest Item Clicker $VERSION (experimental)" --notes "Experimental build; compiled but not verified in FFXIV. Native quest-item hints now work without importing Questionable quest-path data. Starts disarmed; /qic inspect and dry-run before /qic arm."
          fi
          curl --fail --location --silent --show-error "https://github.com/$GH_REPO/releases/download/$TAG/latest.zip" -o downloaded.zip
          cmp staged/latest.zip downloaded.zip
      - name: Commit repository manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json dist/
          if ! git diff --cached --quiet; then
            git commit -m "Publish Quest Item Clicker ${{ steps.prepare.outputs.version }}"
            git push origin HEAD:main
          fi
          echo "Dalamud URL: https://raw.githubusercontent.com/$GH_REPO/main/pluginmaster.json" >> "$GITHUB_STEP_SUMMARY"
